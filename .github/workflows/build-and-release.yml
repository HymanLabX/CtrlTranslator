# CtrlTranslator 自动构建 / 自动发版
#
# 这个文件解决三件事：
#   1. 每次往 main 推代码，GitHub 会在一台干净的 Windows 上重新编译一遍。
#      编译不过会给你发邮件 —— 不用等到你本机打包时才发现。
#   2. 推一个 v 开头的 tag，GitHub 自动打包出 exe + 安装包并建好 Release。
#      再也不会出现「改了代码忘了重新打包，结果测的是旧 exe」。
#   3. 如果配了 SignPath 的签名凭证（见下面「代码签名」注释），
#      发版时会顺手把 exe 和安装包都签上名——没配的话就跳过，照常发未签名版本。
#
# 怎么发新版本（在项目根目录执行两条命令）：
#     git tag v1.0-rc2
#     git push origin v1.0-rc2
# 然后去仓库的 Actions 页面看进度，几分钟后 Releases 页面就有新版本了。
# tag 里带 rc / beta / alpha / preview 字样的会自动标成「预发布」。
#
# 发错了想撤回：
#     gh release delete v1.0-rc2 --yes    # 删 Release
#     git push origin :refs/tags/v1.0-rc2 # 删远端 tag
#     git tag -d v1.0-rc2                 # 删本地 tag

name: 构建与发布

on:
  push:
    branches: [main]      # 推 main：只编译验证，不发版
    tags: ['v*']          # 推 v 开头的 tag：编译 + 发版
  workflow_dispatch: {}   # 也可以在 Actions 页面手动点一下

permissions:
  contents: write         # 建 Release 需要写权限

jobs:
  build:
    # 必须用 Windows：项目是 WPF，只能在 Windows 上编译。
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore CtrlTranslator.sln

      # 下面这段参数必须和 build.ps1 保持一致，改一处就要同步改另一处。
      # PublishTrimmed 必须为 false —— WPF 不支持裁剪，开了会在运行时随机崩溃。
      # IncludeNativeLibrariesForSelfExtract 用于把 SQLite 的原生库打进单文件。
      - name: 发布自包含单文件 exe
        run: >
          dotnet publish src/CtrlTranslator/CtrlTranslator.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish

      - name: 校验产物大小
        shell: pwsh
        run: |
          $exe = 'publish/CtrlTranslator.exe'
          if (-not (Test-Path $exe)) {
            Write-Host '::error::发布命令成功了，但没找到 publish/CtrlTranslator.exe'
            exit 1
          }
          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          # 自包含的 WPF 单文件正常在 60-90 MB。明显偏小说明打包参数被改坏了，
          # 这种 exe 拷到别人电脑上会因为缺 .NET 运行时而打不开。
          if ($sizeMb -lt 40) {
            Write-Host "::error::产物只有 $sizeMb MB，太小了，多半不是自包含的，请检查打包参数"
            exit 1
          }
          Write-Host "大小：$sizeMb MB"

      # 发版参数：tag 里带 rc/beta/alpha/preview 的算预发布，
      # 签名策略也跟着选 test-signing（不影响信任链，只是 SignPath 那边审批更松的策略）。
      - name: 计算发布参数
        id: release-meta
        shell: pwsh
        run: |
          $isPrerelease = '${{ github.ref_name }}' -match 'rc|beta|alpha|preview'
          $policy = if ($isPrerelease) { 'test-signing' } else { 'release-signing' }
          "signing_policy=$policy" >> $env:GITHUB_OUTPUT

      # ============================================================
      # 代码签名
      #
      # 接的是 SignPath.io 的开源项目免费签名服务（https://signpath.io/apply-for-free-signing）。
      # 现在还没申请账号，SIGNPATH_API_TOKEN 这个 secret 是空的，下面几步会被跳过，
      # 产物照常是未签名的，不影响现有发布流程。
      #
      # 申请通过、在 SignPath 建好项目之后，去仓库 Settings → Secrets and variables
      # → Actions 加上：
      #   Secrets:   SIGNPATH_API_TOKEN
      #   Variables: SIGNPATH_ORGANIZATION_ID
      #              SIGNPATH_PROJECT_SLUG
      # 加完不用碰这个文件，下次推正式 tag 就会自动签。完整步骤见 docs/CODE_SIGNING.md
      # （如果最后走的是 Azure Trusted Signing 或自购证书而不是 SignPath，
      # 这一段要整段换掉，文档里也写了要换哪些东西）。
      #
      # 只在推 tag 发版时才签，main 分支的验证性编译不消耗签名额度。
      # ============================================================

      - name: 上传未签名 exe
        id: upload-unsigned-exe
        if: startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: publish/CtrlTranslator.exe
          retention-days: 1

      - name: 签名 exe
        if: startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ steps.release-meta.outputs.signing_policy }}'
          github-artifact-id: '${{ steps.upload-unsigned-exe.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: publish-signed

      - name: 用签名后的 exe 替换未签名版本
        if: startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item publish-signed\CtrlTranslator.exe publish\CtrlTranslator.exe -Force

      # 装一份 exe 版本的安装包（比裸 exe 更像"正经软件"：写 Program Files/用户目录、
      # 建开始菜单项、在"应用和功能"里留卸载记录，能降低被杀毒软件启发式误判的概率）。
      # 打包用的是上面这份 exe —— 如果刚才签过名，安装包里塞的就是签过名的版本。
      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        id: installer
        shell: pwsh
        run: |
          # tag 形如 v1.0-rc2，装包版本号不允许带字母，取纯数字前缀；取不到就退回 1.0.0。
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          if ($tag -match '^\d+(\.\d+){1,3}') {
            $version = $Matches[0]
          } else {
            $version = '1.0.0'
          }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$version" installer\CtrlTranslator.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::安装包编译失败'
            exit 1
          }
          $setupExe = Get-ChildItem 'installer\output' -Filter 'CtrlTranslator-Setup-*.exe' |
            Select-Object -First 1
          Write-Host "安装包：$($setupExe.FullName)"
          "path=$($setupExe.FullName)" >> $env:GITHUB_OUTPUT

      - name: 上传未签名安装包
        id: upload-unsigned-setup
        if: startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: ${{ steps.installer.outputs.path }}
          retention-days: 1

      - name: 签名安装包
        if: startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ steps.release-meta.outputs.signing_policy }}'
          github-artifact-id: '${{ steps.upload-unsigned-setup.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: installer-signed

      - name: 用签名后的安装包替换未签名版本
        if: startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $name = Split-Path -Leaf '${{ steps.installer.outputs.path }}'
          Copy-Item "installer-signed\$name" '${{ steps.installer.outputs.path }}' -Force

      # SHA256SUMS.txt 不只是给人看的：程序内的自动更新会先从 GitHub 拿到这个文件，
      # 下载完安装包后逐字节比对，对不上就删掉、绝不执行。
      # 少了它，"下载一个 exe 然后运行"就等于给自己开了个远程代码执行的口子。
      # 格式是标准的 `<hash>  <filename>`（两个空格），别改成别的排版。
      - name: 计算最终产物 SHA256
        id: artifact
        shell: pwsh
        run: |
          $setupPath = '${{ steps.installer.outputs.path }}'
          $setupName = Split-Path -Leaf $setupPath
          $setupHash = (Get-FileHash $setupPath -Algorithm SHA256).Hash.ToLower()
          $setupSizeMb = [math]::Round((Get-Item $setupPath).Length / 1MB, 1)
          $exeHash = (Get-FileHash publish/CtrlTranslator.exe -Algorithm SHA256).Hash.ToLower()

          "$setupHash  $setupName" | Set-Content SHA256SUMS.txt -Encoding ascii -NoNewline
          "`n" | Add-Content SHA256SUMS.txt -Encoding ascii -NoNewline

          Write-Host "$setupName  SHA256  $setupHash"
          Write-Host "CtrlTranslator.exe（仅作安装包输入，不再单独发布）SHA256  $exeHash"
          "setup_name=$setupName" >> $env:GITHUB_OUTPUT
          "setup_sha256=$setupHash" >> $env:GITHUB_OUTPUT
          "setup_size_mb=$setupSizeMb" >> $env:GITHUB_OUTPUT

      # 不是 tag 触发时也留一份产物，方便临时拿去测。
      # 注意：从 Actions 页面下载下来的是个 zip，要解压才能拿到 exe。保留 30 天。
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: CtrlTranslator-exe
          path: |
            publish/CtrlTranslator.exe
            installer/output/CtrlTranslator-Setup-*.exe
          retention-days: 30

      # 只有推 tag 时才发版。推 main 只是编译验证，不会产生 Release。
      - name: 创建 Release 并上传产物
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SETUP_NAME: ${{ steps.artifact.outputs.setup_name }}
          SETUP_SHA256: ${{ steps.artifact.outputs.setup_sha256 }}
          SETUP_SIZE_MB: ${{ steps.artifact.outputs.setup_size_mb }}
          SIGNED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          $fence = '```'
          $signedNote = if ($env:SIGNED -eq 'true') {
            '这份构建经过代码签名。'
          } else {
            '这份构建**没有代码签名**，Windows SmartScreen / 杀毒软件可能拦截，处理办法见 README「杀毒软件可能误报」。'
          }
          $lines = @(
            "由 tag ``$env:TAG`` 自动构建。$signedNote",
            '',
            "下载 ``$env:SETUP_NAME`` 安装即可。首次启动会引导你填 API 地址和 Key。",
            '已经装过的话不用手动下载 —— 程序自己会发现新版本并提示一键更新。',
            '',
            "用法、已知限制（含杀毒软件误报怎么处理）见 [README](https://github.com/$env:REPO#readme)。",
            '',
            '### 校验',
            '',
            '`SHA256SUMS.txt` 也是程序内自动更新用来校验安装包的依据，请勿删除该资产。',
            '',
            $fence,
            "$env:SETUP_SHA256  $env:SETUP_NAME",
            "大小 $env:SETUP_SIZE_MB MB",
            $fence
          )
          $lines -join "`n" | Set-Content release-notes.md -Encoding utf8

          # tag 里带 rc / beta / alpha / preview 的自动标成预发布。
          # 只发安装包 + 校验文件：免安装裸 exe 不再作为发布产物（它没法安全地自我更新，
          # 自我替换的动作在杀毒软件眼里跟蠕虫几乎一样）。它仍然会被构建，作为安装包的输入。
          $ghArgs = @(
            'release', 'create', $env:TAG,
            '${{ steps.installer.outputs.path }}',
            'SHA256SUMS.txt',
            '--title', "CtrlTranslator $env:TAG",
            '--notes-file', 'release-notes.md'
          )
          if ($env:TAG -match 'rc|beta|alpha|preview') { $ghArgs += '--prerelease' }

          gh @ghArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::建 Release 失败。如果提示 already exists，说明这个 tag 之前发过了，先删掉旧 Release 再重推 tag。'
            exit 1
          }
